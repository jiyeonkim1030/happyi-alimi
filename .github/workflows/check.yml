name: Happy-I checker

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: happi-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check kindergarten and send push
        env:
          HAPPI_ID: ${{ secrets.HAPPI_ID }}
          HAPPI_PASSWORD: ${{ secrets.HAPPI_PASSWORD }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: python checker.py

      - name: Save checker state
        run: |
          git config user.name "happyi-bot"
          git config user.email "happyi-bot@users.noreply.github.com"
          git add -f .state
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "Update checker state [skip ci]"
          git push
