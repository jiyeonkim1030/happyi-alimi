<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="해피아이 알리미">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>해피아이 알리미</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
    body { margin:0; background:#f6f7f9; color:#17191d; }
    main { max-width:640px; margin:0 auto; padding:28px 18px 60px; }
    .hero { background:#fff; border-radius:24px; padding:24px; box-shadow:0 8px 30px rgba(0,0,0,.06); }
    h1 { margin:0 0 8px; font-size:28px; }
    p { line-height:1.6; }
    .status { margin:18px 0; padding:14px 16px; border-radius:16px; background:#f1f3f5; }
    button,.button { width:100%; box-sizing:border-box; border:0; border-radius:16px; padding:15px 18px; font-size:17px; font-weight:700; cursor:pointer; text-align:center; text-decoration:none; display:block; }
    #notifyBtn { background:#17191d; color:white; }
    #openBtn { background:#fff; color:#17191d; border:1px solid #d9dde3; margin-top:10px; }
    .card { margin-top:18px; background:#fff; border-radius:20px; padding:20px; }
    .eyebrow { font-size:13px; color:#6b7280; font-weight:700; }
    .title { font-size:19px; font-weight:800; margin-top:7px; line-height:1.45; }
    .small { color:#717680; font-size:14px; }
  </style>
  <script src="config.js"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
<main>
  <section class="hero">
    <div class="eyebrow">준서 유치원 새 글 알림</div>
    <h1>해피아이 알리미</h1>
    <p>사랑반 · 가정통신문 · 오늘의 식단에 새 글이 올라오면 아이폰으로 알려드립니다.</p>
    <div class="status" id="status">알림 상태를 확인하는 중입니다.</div>
    <button id="notifyBtn">알림 켜기</button>
    <p class="small">아이폰에서는 먼저 이 페이지를 홈 화면에 추가한 뒤, 홈 화면의 ‘해피아이’ 아이콘으로 열어 알림을 켜주세요.</p>
  </section>

  <section class="card" id="postCard" hidden>
    <div class="eyebrow" id="postBoard"></div>
    <div class="title" id="postTitle"></div>
    <a class="button" id="openBtn" href="#">유치원 원문 열기</a>
  </section>
</main>

<script>
const cfg = window.HAPPI_CONFIG || {};
const statusEl = document.getElementById("status");
const btn = document.getElementById("notifyBtn");

const basePath = location.pathname.endsWith("/")
  ? location.pathname
  : location.pathname.replace(/[^/]*$/, "");
const workerPath = basePath.replace(/^\//, "") + "push/onesignal/OneSignalSDKWorker.js";
const workerScope = basePath + "push/onesignal/";

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  if (!cfg.oneSignalAppId || cfg.oneSignalAppId.includes("PASTE_")) {
    statusEl.textContent = "아직 OneSignal App ID 설정이 필요합니다.";
    btn.disabled = true;
    return;
  }

  await OneSignal.init({
    appId: cfg.oneSignalAppId,
    serviceWorkerPath: workerPath,
    serviceWorkerParam: { scope: workerScope }
  });

  const refresh = () => {
    const allowed = OneSignal.Notifications.permission;
    statusEl.textContent = allowed
      ? "알림이 켜져 있습니다. 새 글이 올라오면 알려드릴게요."
      : "알림이 아직 꺼져 있습니다.";
    btn.textContent = allowed ? "알림 켜짐" : "알림 켜기";
    btn.disabled = allowed;
  };

  refresh();
  OneSignal.Notifications.addEventListener("permissionChange", refresh);

  btn.addEventListener("click", async () => {
    await OneSignal.Notifications.requestPermission();
    refresh();
  });
});

const params = new URLSearchParams(location.search);
const target = params.get("target");
if (target && target.startsWith("http://www.happyikindergarten.com/")) {
  const card = document.getElementById("postCard");
  document.getElementById("postBoard").textContent = params.get("board") || "새 글";
  document.getElementById("postTitle").textContent = params.get("title") || "해피아이 새 글";
  document.getElementById("openBtn").href = target;
  card.hidden = false;

  // Notification tap -> PWA -> original post.
  setTimeout(() => {
    location.href = target;
  }, 700);
}
</script>
</body>
</html>
